<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
 <title>Anillos Mágicos</title>
 <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
 <script>
   AFRAME.registerComponent('png-sequence', {
     schema: {
       folder: {type: 'string'},
       frameCount: {type: 'number', default: 50},
       fps: {type: 'number', default: 24},
       prefix: {type: 'string', default: 'frame'},
       digits: {type: 'number', default: 3}
     },
     init: function () {
       this.frames = [];
       this.currentFrame = 0;
       this.elapsed = 0;

       for (let i = 1; i <= this.data.frameCount; i++) {
         const num = String(i).padStart(this.data.digits, '0');
         const img = new Image();
         img.src = this.data.folder + '/' + this.data.prefix + num + '.png';
         this.frames.push(img);
       }

       this.el.setAttribute('material', {
         shader: 'flat',
         transparent: true,
         src: this.frames[0]
       });
     },
     tick: function (time, timeDelta) {
       this.elapsed += timeDelta;
       const frameDuration = 1000 / this.data.fps;
       if (this.elapsed > frameDuration) {
         this.elapsed = 0;
         this.currentFrame = (this.currentFrame + 1) % this.frames.length;
         this.el.setAttribute('material', 'src', this.frames[this.currentFrame]);
       }
     }
   });
 </script>
</head>
<body style="margin: 0; overflow: hidden;">

 <a-scene
   mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: true; uiScanning: no;"
   color-space="sRGB"
   renderer="colorManagement: true, physicalCorrectLights"
   vr-mode-ui="enabled: false"
   device-orientation-permission-ui="enabled: true"
 >

   <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

   <a-entity mindar-image-target="targetIndex: 0">
     <a-plane
       png-sequence="folder: ./animations/ring0; frameCount: 50; fps: 24"
       material="shader: flat; transparent: true"
       position="0 0.3 0"
       width="1" height="1"
     ></a-plane>
   </a-entity>
 </a-scene>

</body>
</html>
